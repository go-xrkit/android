name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A workflow that fails to PARSE reports nothing at all -- it does not run,
  # and nothing goes red. So the workflows are linted before anything trusts
  # them, and this lane is first for exactly that reason.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # Build, vet and test the module CGO-free on Linux, then enforce a 100%
  # statement-coverage gate.
  #
  # ⛔ THAT GATE IS ON THE TOTAL, WITH NO MARGIN, so a toolchain that recounts
  # statements moves the number under it without a line of code changing. Go
  # 1.27 counts more statements per block than 1.26 -- measured here, 381 -> 399
  # on one commit -- and elsewhere in this fleet that shifted a total by ten
  # points. It is harmless at exactly 100%: when every statement is covered the
  # weights cannot matter. Measured before pinning: 100.0% on 87 functions under
  # both 1.26.4 and 1.27.1. That is WHY the version below is pinned rather than
  # tracking `stable`, which moved this repository to 1.27 with no commit.
  #
  # The transport (client_linux.go) is //go:build linux, and Android IS Linux:
  # the abstract socket it dials and the shared mapping it reads are ordinary
  # Linux facilities, so this lane exercises the REAL back-end -- against a fake
  # host over a real socket, a real memfd and a real SCM_RIGHTS handover --
  # rather than a stand-in. It is also the only lane that can run the race
  # detector at all: -race needs cgo, which is the very thing an Android
  # application binary must not have.
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - run: go version
      - run: CGO_ENABLED=0 go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - name: Gofmt
        # go vet does NOT check formatting, so drift accumulates silently.
        # Printing the diff makes a failure actionable rather than a list of
        # names.
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then
            echo "::error::not gofmt-clean:"; echo "$drift"
            gofmt -d .
            exit 1
          fi
      - name: Test (whole module)
        run: CGO_ENABLED=0 go test ./...
      - name: Race
        # Close unmaps memory a frame may be borrowed from, and the pump
        # delivers frames from its own goroutine: this package's whole risk is
        # concurrency, so it is raced on every push.
        env:
          CGO_ENABLED: "1"
        run: go test -race -timeout 300s ./...
      - name: 100% coverage gate
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race -timeout 300s -coverprofile=cover.out .
          go tool cover -func=cover.out | tail -n 40
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  # The off-Android lane: the codec and the ErrUnsupported stub must still
  # build, vet and pass where there is no host to dial, so a compositor that
  # drives one capture package per platform keeps cross-building on a macOS or
  # Windows workstation. It is gated at 100% too -- a stub nobody tests is a
  # stub that panics the day somebody links it.
  darwin-stub:
    name: darwin (stub)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - run: CGO_ENABLED=0 go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - name: Test and gate coverage
        run: |
          CGO_ENABLED=0 go test -coverprofile=cover.out .
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  # The APK itself: no Gradle, no Kotlin -- javac, d8, aapt2, zipalign and
  # apksigner against the runner's own SDK. This proves the shipped host
  # sources and build.sh still produce a signed, installable package, and that
  # the Go application still cross-builds into it.
  apk:
    name: apk (host + application)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Build the APK
        run: ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT} host/build.sh
      - name: Verify the signature
        run: |
          # find, not ls: shellcheck is right that ls output is not a safe
          # list, even where these names are always plain version numbers.
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$bt/apksigner" verify --verbose host/out/xrhost.apk
      - uses: actions/upload-artifact@v4
        with:
          name: xrhost-apk
          path: host/out/xrhost.apk

  # Cross-build every target an application might ship to. android/arm64 is the
  # point of the module; the rest prove the ErrUnsupported stub keeps the module
  # portable.
  cross:
    name: cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: android, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: riscv64 }
          - { goos: linux,   goarch: loong64 }
          - { goos: linux,   goarch: ppc64le }
          - { goos: linux,   goarch: s390x }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
      - name: Vet (${{ matrix.goos }}/${{ matrix.goarch }})
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

  # Pin the CGO-free reach of the Android port itself, which is what this module
  # claims and what a consumer plans a release around: arm64 links with no C
  # tool chain, and the other three Android targets do not. Asserting both
  # halves means the day either changes, this lane says so.
  android-cgo-free:
    name: android CGO-free reach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: arm64 links CGO-free
        run: CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -o /dev/null ./cmd/xrcapture
      - name: arm, amd64 and 386 still require cgo
        run: |
          for arch in arm amd64 386; do
            if CGO_ENABLED=0 GOOS=android GOARCH=$arch go build -o /dev/null ./cmd/xrcapture 2>/dev/null; then
              echo "::notice::android/$arch now links CGO-free -- widen the matrix and the README"
              exit 1
            fi
            echo "android/$arch requires cgo, as documented"
          done

  # Validate the module on the supported 64-bit targets, strictly CGO=0.
  # amd64/arm64 run natively; the rest run under qemu-user.
  arch:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - run: go env GOARCH && CGO_ENABLED=0 go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Test under qemu (${{ matrix.goarch }})
        run: CGO_ENABLED=0 GOARCH=${{ matrix.goarch }} go test -exec=${{ matrix.qemu }} ./...
